<!DOCTYPE html>  
<html lang="en">  
<head>  
<meta charset="UTF-8">  
<meta name="viewport" content="width=device-width, initial-scale=1.0">  
<title>Login - Crowdmine Investment</title>  
<link rel="stylesheet" href="style.css">  
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
</head>  
<body>  
<nav class="navbar">  
<div class="container">  
<div class="logo">  
<div class="logo-icon">  
<i class="fas fa-coins"></i>  
<i class="fas fa-chart-line"></i>  
</div>  
<div class="logo-text">  
<span class="logo-title">CROWDMINE</span>  
<span class="logo-subtitle">INVESTMENT</span>  
</div>  
</div>  
<ul class="nav-menu">  
<li><a href="index.html">Home</a></li>  
<li><a href="plans.html">Investment Plans</a></li>  
<li><a href="deposit.html">Deposit</a></li>  
<li><a href="register.html" class="btn-register">Register</a></li>  
</ul>  
</div>  
</nav>

<section class="auth-section">  
<div class="container">  
<div class="auth-box">  
<div class="auth-header">  
<i class="fas fa-sign-in-alt"></i>  
<h2>Login to Your Account</h2>  
<p>Access your investment dashboard</p>  
</div>

<form id="loginForm" class="auth-form">  
<div class="form-group">  
<label><i class="fas fa-envelope"></i> Email Address</label>  
<input type="email" id="loginEmail" placeholder="your@email.com" required>  
</div>

<div class="form-group">  
<label><i class="fas fa-lock"></i> Password</label>  
<input type="password" id="loginPassword" placeholder="Enter password" required>  
</div>

<div class="form-options">  
<label class="checkbox-label">  
<input type="checkbox">  
<span>Remember me</1span>  
</label>  
<a href="#" class="forgot-link">Forgot password?</a>  
</div>

<button type="submit" class="btn btn-primary btn-block">  
<i class="fas fa-sign-in-alt"></i> Login  
</button>  
</form>

<div id="otpSection" style="display: none;">  
<div class="otp-header">  
<i class="fas fa-shield-alt"></i>  
<h3>Two-Step Verification</h3>  
<p>Check your email for the security code</p>  
</div>  
<form id="otpForm">  
<div class="form-group">  
<label>Email Verification Code</label>  
<input type="text" id="loginOtp" placeholder="6-digit code" required>  
</div>  
<button type="submit" class="btn btn-primary btn-block">  
<i class="fas fa-check-circle"></i> Verify & Login  
</button>  
</form>  
</div>

<div class="auth-footer">  
<p>Don't have an account? <a href="register.html">Register here</a></p>  
</div>  
</div>  
</div>  
</section>

<script>  
function sendLoginOTP(email, otp) {  
alert(`Security code sent to ${email}. Use code: ${otp}`);  
}

document.getElementById('loginForm').addEventListener('submit', function(e) {  
e.preventDefault();  
const email = document.getElementById('loginEmail').value;  
const password = document.getElementById('loginPassword').value;

// Check if user is verified  
const verifiedUser = JSON.parse(localStorage.getItem('verifiedUser'));  
if (!verifiedUser || verifiedUser.email !== email || verifiedUser.password !== password) {  
alert('Invalid credentials or account not verified!');  
return;  
}

// Generate login OTP  
const otp = Math.floor(100000 + Math.random() * 900000);  
sendLoginOTP(email, otp);

// Store OTP for verification  
localStorage.setItem('loginOTP', otp);  
localStorage.setItem('loginEmail', email);

// Show OTP section  
document.getElementById('loginForm').style.display = 'none';  
document.getElementById('otpSection').style.display = 'block';  
});

document.getElementById('otpForm').addEventListener('submit', function(e) {  
e.preventDefault();  
const enteredOtp = document.getElementById('loginOtp').value;  
const storedOtp = localStorage.getItem('loginOTP');

if (enteredOtp === storedOtp) {  
localStorage.setItem('isLoggedIn', 'true');  
localStorage.setItem('userEmail', localStorage.getItem('loginEmail'));  
localStorage.removeItem('loginOTP');

alert('Login successful! Redirecting to dashboard...');  
window.location.href = 'dashboard.html';  
} else {  
alert('Invalid verification code!');  
}  
});  
</script>  
</body>  
</html>
